<div class="chat-container">
  <header class="main-header">
    <div class="brand">
      <span class="logo-icon" aria-hidden="true">H/B</span>
      <div class="title-group" (click)="handleLeaveAction()">
        <h1>Human Or Bot</h1>
        <div class="status-indicator">
          <span class="dot" [class]="gameService.connectionStatus().toLowerCase()"></span>
          <span class="status-text">{{ gameService.connectionStatus() | titlecase }}</span>
        </div>
      </div>
    </div>

    @if (gameService.connectionStatus() === 'MATCHED') {
    <button class="exit-btn" (click)="handleLeaveAction()">
      End session
    </button>
    }
  </header>

  <main class="content-area">
    <router-outlet></router-outlet>
  </main>
</div>
